<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered, Ordered and Description Lists</title>

</head>
<body>
    <!--Assignment 5 : Unordered, Ordered and Description Lists-->
    <h2>Unordered list</h2>
    <ul>
        <li>Web Designing</li>
        <li>Artificial Intelligence</li>
        <li>Data Structure</li>
    </ul>
    <h2>Ordered Lists</h2>
    <ol>
        <li>Save the HTML</li>
        <li>Stage and commit changes</li>
        <li>Push to Github</li>
    </ol>
    <h2>Description lists</h2>
    <dl>
        <dt><b>HTML</b></dt>
        <dd>Hyper text mark up language for creating web pages</dd>
        <dt><b>CSS</b></dt>
        <dd>Cascading Style sheets for styling web pages</dd>
    </dl>
</body>
</html>
