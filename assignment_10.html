<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia: image,video,audio and youtube</title>
</head>
<body>
    <!--Assignment:10 Multimedia: image,video,audio and youtube-->
    <h3>Image</h3>
    <img src="campus.jpg" alt="College campus" width ="360" height="215">
    <h3>Video</h3>
    <video width ="260" controls>
        <source src="sample.mp4" type="video/mp4">
    </video>
    <h3>Audio</h3>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
    </audio>
    <h3>Youtube</h3>
    <iframe width="360" height="215" src="https://youtube.com" title="Youtube video" allowfullscreen></iframe>
</body>
</html>
