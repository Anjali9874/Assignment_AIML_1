<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu using lists</title>
</head>
<style>
    ul { display: flex; list-style: none; margin: 0; background: #333}
    a { display: block; color: white; padding: 14px 20px; text-decoration: none;}
    a:hover {background: #111;}
</style>
<body>
    <!--Assignment 7: Navigation menu using lists-->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#Courses">Courses</a></li>
            <li><a href="#Contact">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
